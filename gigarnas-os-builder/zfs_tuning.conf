# ==============================================================================
# GigaNas OS - OpenZFS Engine Optimization Parameters
# Archivo de destino en el sistema: /etc/modprobe.d/zfs.conf
# ==============================================================================

# Garantizar que el sistema siempre reserve al menos 1GB libre de RAM (previene OOM en equipos de 4GB-8GB)
options zfs zfs_arc_sys_free=1073741824

# Optimización de tareas en segundo plano (Scrub y Resilver)
# Limita la prioridad de I/O de scrub para que Plex/Jellyfin o SMB no se congelen durante la verificación semanal
options zfs zfs_vdev_scrub_max_active=2
options zfs zfs_vdev_scrub_min_active=1

# Optimización de lectura y escritura asíncrona para pools RAIDZ1/RAIDZ2
options zfs zfs_vdev_async_read_max_active=8
options zfs zfs_vdev_async_read_min_active=2
options zfs zfs_vdev_async_write_max_active=8
options zfs zfs_vdev_async_write_min_active=2

# Sincronización de transacciones TXG (reduce latencia en escrituras SMB masivas)
options zfs zfs_txg_timeout=5

# Prefetch adaptativo para archivos grandes (Películas 4K y archivos multimedia)
options zfs zfs_prefetch_disable=0
