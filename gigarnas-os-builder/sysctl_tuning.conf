# ==============================================================================
# GigaNas OS - High-Performance Kernel & Network Tuning
# Archivo de destino en el sistema: /etc/sysctl.d/99-gigarnas-performance.conf
# ==============================================================================

# 1. TCP BBR v2 Congestion Control (Saturación de línea 2.5GbE y 10GbE)
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# 2. Buffers de Red TCP y Redirección de Paquetes
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.core.rmem_default = 1048576
net.core.wmem_default = 1048576
net.core.optmem_max = 2048576
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216
net.core.netdev_max_backlog = 50000

# 3. Optimización de Memoria y Escrituras en Disco (Zero Freeze)
# Mantiene escrituras de disco controladas para evitar congelamientos en SMB
vm.dirty_background_ratio = 5
vm.dirty_ratio = 10
vm.vfs_cache_pressure = 50
vm.swappiness = 10

# 4. Límites de Archivos Abiertos (Docker & ZFS Datasets masivos)
fs.file-max = 2097152
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 8192
